[project]
name = "hookd-tracker"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "apps/mcp", "packages/core"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["hookd_api", "hookd_core", "hookd_mcp", "hookd_worker"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["apps/api/tests", "apps/worker/tests", "apps/mcp/tests", "packages/core/tests"]
