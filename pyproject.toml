[project]
name = "hookd-tracker"
version = "0.1.0"
requires-python = ">=3.12"
# Depend on every member so `uv run` from the repo root always has them installed
dependencies = ["hookd-api", "hookd-worker", "hookd-mcp", "hookd-core"]

[tool.uv.sources]
hookd-api = { workspace = true }
hookd-worker = { workspace = true }
hookd-mcp = { workspace = true }
hookd-core = { workspace = true }

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "apps/mcp", "packages/core"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx>=0.28",
    "moto[dynamodb]>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["hookd_api", "hookd_core", "hookd_mcp", "hookd_worker"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["apps/api/tests", "apps/worker/tests", "apps/mcp/tests", "packages/core/tests"]
