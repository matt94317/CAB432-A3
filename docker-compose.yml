services:
  # Local stand-in for Amazon DynamoDB (in memory: data resets when it restarts)
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports: ["8002:8000"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # Local stand-in for Amazon SQS
  sqs:
    image: softwaremill/elasticmq-native
    ports: ["9324:9324"]
    volumes: [./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment: &container-env
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      DYNAMODB_CREATE_TABLE: "true"
      SYNC_MODE: queue  # the worker runs alongside
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://sqs:9324
      SYNC_QUEUE_URL: http://sqs:9324/000000000000/hookd-sync
    command: uvicorn hookd_api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: [./apps/api/src:/app/apps/api/src, ./packages/core/src:/app/packages/core/src]
    ports: ["8000:8000"]
    depends_on: [dynamodb, redis, sqs]

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: .env
    environment: *container-env
    volumes: [./apps/worker/src:/app/apps/worker/src, ./packages/core/src:/app/packages/core/src]
    depends_on: [dynamodb, redis, sqs]

  mcp:
    build: { context: ., dockerfile: apps/mcp/Dockerfile }
    env_file: .env
    environment:
      HOOKD_API_URL: http://api:8000/api
    ports: ["8001:8001"]
    depends_on: [api]

