[project]
name = "hookd-worker"
version = "0.1.0"
description = "Hookd Tracker SQS sync workers"
requires-python = ">=3.12"
dependencies = [
    "hookd-core",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "httpx>=0.28",
    "redis>=5.2",
]

[project.scripts]
hookd-worker = "hookd_worker.main:main"

[tool.uv.sources]
hookd-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
